kind = "web"
previewPath = "/"
title = "Fun Tech Club MITS"
description = "A visually rich, lightweight club website for Fun Tech at MITS, featuring its community, projects, events, and ways to get involved."
version = "1.0.0"
id = "artifacts/fun-tech-club"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18584

[services.development]
run = "pnpm --filter @workspace/fun-tech-club run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fun-tech-club", "run", "build" ]
serve = "static"
publicDir = "artifacts/fun-tech-club/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18584"
BASE_PATH = "/"
